site_name: 世界模型 · VLA · VLM 学习库（无人机视角）
site_description: 59 篇中文文档 · 195 篇论文 · 24 个纯 CPU 可跑 demo · 28.7 万字
site_url: https://qxy661.github.io/UAV-WM-VLA-Learning/
repo_url: https://github.com/Qxy661/UAV-WM-VLA-Learning
repo_name: Qxy661/UAV-WM-VLA-Learning
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Qxy661 · MIT License

# build-docs/ 由 tools/build_docs.py 生成（见该脚本注释）。不要直接指向仓库根：
# 根目录有 1.1 GB 的 paper/，而 mkdocs serve 不遵守 exclude_docs。
docs_dir: build-docs

# 关掉 use_directory_urls：仓库里有一批指向**目录**的链接（README 的 `docs/01-基础概念/`、
# 正文里的 `../06-论文导读合集/`）。mkdocs 只重写 .md 链接，目录链接原样保留；
# 而 use_directory_urls 会给每个页面多加一层目录，导致这类链接少一层而 404。
# 关掉后页面仍是每目录一个 index.html，目录链接正好落在 index.html 上。
use_directory_urls: false

theme:
  name: material
  # language 只在这里写。search 插件【不要】写 lang，否则
  # "Option search.lang 'zh' is not supported" 会让 mkdocs build --strict 直接失败。
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: 切到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: 切到浅色
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      # 中文分词要在构建期装 jieba（pip install mkdocs-material jieba），
      # 且 path 相对 mkdocs 运行目录（仓库根）。见 CONTRIBUTING。
      jieba_dict_user: tools/jieba_dict.txt

markdown_extensions:
  - attr_list          # 保住 README 里的 <a id="..."> 与导航锚点
  - md_in_html
  - tables
  - admonition
  - footnotes
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

# 默认的 links 校验级别多为 INFO，--strict 抓不到断链；这里显式抬高。
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: info

