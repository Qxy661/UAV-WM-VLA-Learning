name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 相对链接检查
        run: python tools/check_links.py
      - name: nav 一致性检查
        run: python tools/check_nav.py
      - name: 知识点注册表检查
        run: python tools/kp.py check
      - name: 英文总览覆盖检查
        run: python tools/gen_en_index.py --check

  numbers:
    # 数字对账：文档里引用的指标要在 demo 里重新算得出来。
    # 单独一个 job，因为要装 torch、跑几分钟，不该拖慢提交反馈的主链路。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 CPU 版 torch 与绘图依赖
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy matplotlib
      - name: 中文字体（图里要写中文，缺字体 matplotlib 会警告但不算失败）
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: 比对 code/expected/metrics.json
        env:
          MPLBACKEND: Agg
        run: python tools/check_numbers.py

  project:
    # 工程层的契约测试：不装 pybullet，跑 rigid 后端。
    # 这正是 ADR-008 要证明的事——"没有引擎也跑得起来"。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: 安装最小依赖
        run: pip install numpy PyYAML pytest
      - name: M0 契约测试（rigid 后端）
        run: python -m pytest projects/uav-inspect/tests -q
      - name: M0 验收跑一遍
        run: python projects/uav-inspect/scripts/m0_hover.py --backend rigid
      - name: 验收结果
        run: python -c "import json;d=json.load(open('projects/uav-inspect/runs/m0_hover/metrics.json'));assert d['passed'],d;print('M0 passed', d['metrics']['rmse_m'])"
      - name: M1 四机交叉避让
        run: python projects/uav-inspect/scripts/m1_multi.py --backend rigid
      - name: M1 验收结果
        run: python -c "import json;d=json.load(open('projects/uav-inspect/runs/m1_multi/metrics.json'));assert d['passed'],d;print('M1 passed', d['metrics']['min_separation_m'])"
      - name: 避让单元检查
        run: python projects/uav-inspect/scripts/check_avoidance.py
      - name: M2 巡检录制两集
        run: python projects/uav-inspect/scripts/m2_inspect.py --episodes 2 --backend rigid --out projects/uav-inspect/runs/m2_dataset
      - name: M2 验收结果
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path("projects/uav-inspect/runs/m2_dataset")
          meta = [json.loads(p.read_text(encoding="utf-8"))
                  for p in sorted(root.glob("episode_*/meta.json"))]
          assert len(meta) == 2, meta
          for m in meta:
              assert m["coverage"] == 1.0, m["coverage"]
              assert m["occluded_viewpoints"] == ["behind-rack"], m["occluded_viewpoints"]
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert len(manifest["episodes"]) == 2, manifest
          print("M2 passed", [m["frames"] for m in meta])
          PY
      - name: M5 安全层契约检查
        run: python projects/uav-inspect/scripts/check_safety.py
      - name: M5 四类故障注入
        run: python projects/uav-inspect/scripts/m5_faults.py
      - name: M6 评测口径与三基线（小样本冒烟）
        run: |
          python projects/uav-inspect/scripts/m6_eval.py --episodes 2 --seeds 1
          python - <<'PY'
          import json, pathlib
          d = json.loads(pathlib.Path("projects/uav-inspect/runs/m6_eval/metrics.json").read_text(encoding="utf-8"))
          assert d["protocol"]["version"] == "m6-v1", d["protocol"]
          got = {a["agent"]: a for a in d["agents"]}
          assert got["scripted-waypoints"]["success"]["rate"] == 1.0, got["scripted-waypoints"]
          assert got["hover-only"]["success"]["rate"] == 0.0, got["hover-only"]
          print("M6 passed", {k: v["success"]["rate"] for k, v in got.items()})
          PY

  docs:
    # 只在 main 上发布；PR 只跑上面的检查，不动线上站点
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 mkdocs-material 与 jieba
        # 版本钉住：material 自 2025-11 转入维护模式，9.7.* 是最后一个把中文分词
        # 对所有人免费开放的版本。jieba 必须显式装——material 不含它，
        # 缺了会静默退回英文式切分，中文搜索看起来正常其实搜不到。
        run: pip install "mkdocs-material==9.7.*" "mkdocs<2" jieba
      - name: 生成暂存树
        run: python tools/build_docs.py
      - name: 构建并发布到 gh-pages
        run: mkdocs gh-deploy --force
